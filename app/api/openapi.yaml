openapi: 3.2.0
info:
  title: Loris web API
  version: 1.0.0

servers:
  - url: http://localhost:5158/api/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Users
    description: User account management

paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input field(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Display name already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Unique identifier of the user
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Users
      summary: Update a User
      description: Partially updates the user's display name, password and/or role (changes only the provided fields). Any combination of fields can be provided, at least one is required.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input field(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Display name already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:
    User:
      type: object
      required:
        - userId
        - displayName
        - role
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
    CreateUserRequest:
      type: object
      required:
        - displayName
        - password
        - role
      properties:
        displayName:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
        - description
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
