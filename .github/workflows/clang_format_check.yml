name: CI Pipeline

on:
  push:
    branches: [zephyr_dev, main]
  pull_request:
    branches: [zephyr_dev, main]

jobs:
  check_formatting:
    name: Check Code Formatting
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          find zephyr/ -type f \( -iname '*.c' -o -iname '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
