syntax = "proto3";

package protocol.v1;

option csharp_namespace = "app.Protocol";
import 'nanopb.proto';

enum ValueType {
  // General
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_NUMERIC = 1;
  VALUE_TYPE_TEXT = 2;
  VALUE_TYPE_BOOL = 3;
  // Common
  VALUE_TYPE_TEMPERATURE = 4;
  VALUE_TYPE_PRESSURE = 5;
  VALUE_TYPE_FREQUENCY = 6;
  VALUE_TYPE_MOISTURE = 7;
  VALUE_TYPE_UPTIME = 8;
  VALUE_TYPE_AREA = 9;
  VALUE_TYPE_DISTANCE = 10;
  VALUE_TYPE_DURATION = 11;
  VALUE_TYPE_ILLUMINANCE = 12;
  VALUE_TYPE_WATER = 13;
  VALUE_TYPE_WEIGHT = 14;
  // Air index
  VALUE_TYPE_AQI = 15;
  VALUE_TYPE_CO2 = 16;
  VALUE_TYPE_PM1 = 17;
  VALUE_TYPE_PM25 = 18;
  VALUE_TYPE_PM4 = 19;
  VALUE_TYPE_PM10 = 20;
  VALUE_TYPE_HUMIDITY = 21;
  // Wind
  VALUE_TYPE_WIND_SPEED = 22;
  // Electricity
  VALUE_TYPE_BATTERY = 23;
  VALUE_TYPE_ENERGY = 24;
  VALUE_TYPE_VOLTAGE = 25;
  VALUE_TYPE_CURRENT = 26;
  // Transmission
  VALUE_TYPE_DATA_RATE = 27;
  VALUE_TYPE_DATA_SIZE = 28;
  VALUE_TYPE_SIGNAL_STRENGTH = 29;
  // Earth
  VALUE_TYPE_PH = 30;
  VALUE_TYPE_POTASSIUM = 31;
  VALUE_TYPE_PHOSPHORUS = 32;
  VALUE_TYPE_NITROGEN = 33;
}

enum FuncArgType {
  FUNC_ARG_TYPE_UNSPECIFIED = 0;
  FUNC_ARG_TYPE_VOID = 1;
  FUNC_ARG_TYPE_INT = 2;
  FUNC_ARG_TYPE_FLOAT = 3;
  FUNC_ARG_TYPE_STRING = 4;
  FUNC_ARG_TYPE_BOOL = 5;
}

message Sensor {
  int32 id = 1;
  string name = 2 [(nanopb).callback_datatype = "str_t"];
  string description = 3 [(nanopb).callback_datatype = "str_t"];
  ValueType value_type = 4;
  optional string unit = 5 [(nanopb).callback_datatype = "str_t"];
}

message Function {
  int32 id = 1;
  string name = 2 [(nanopb).callback_datatype = "str_t"];
  string description = 3 [(nanopb).callback_datatype = "str_t"];
  FuncArgType arg_type = 4;
}

message Capabilities {
  string device_name = 1 [(nanopb).callback_datatype = "str_t"];
  repeated Sensor sensors = 2;
  repeated Function functions = 3;
}

message Report {
  int32 sensor_id = 1;
  oneof value {
    int32 int_val = 2;
    float float_val = 3;
    string str_val = 4 [(nanopb).callback_datatype = "str_t"];
    bool bool_val = 5;
  }
}

message Call {
  int32 function_id = 1;
  oneof value {
    int32 int_val = 2;
    string str_val = 3 [(nanopb).callback_datatype = "str_t"];
    bool bool_val = 4;
    float float_val = 5;
  }
  optional int32 wake_after_secs = 6;
}

enum UpPingType {
  UP_PING_TYPE_UNSPECIFIED = 0;
  UP_PING_TYPE_HELLO = 1;
}

message UpPing {
  UpPingType type = 1;
}

enum DownPingType {
  DOWN_PING_TYPE_UNSPECIFIED = 0;
  DOWN_PING_TYPE_HELLO = 1;
  DOWN_PING_TYPE_DISCONNECT = 2;
}

message DownPing {
  DownPingType type = 1;
}

message Downlink {
  oneof payload {
    Call call = 1;
    DownPing ping = 2;
  }
}

message Uplink {
  oneof payload {
    Report report = 1;
    Capabilities capabilities = 2;
    UpPing ping = 3;
  }
}
