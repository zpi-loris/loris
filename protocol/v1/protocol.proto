syntax = "proto3";

package protocol.v1;

option csharp_namespace = "Loris.Protocol";

enum ValueType {
  // General
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_NUMERIC = 1;
  VALUE_TYPE_TEXT = 2;
  VALUE_TYPE_BOOL = 3;
}

enum SensorValueType {
  SENSOR_VALUE_TYPE_UNSPECIFIED = 0;
  SENSOR_VALUE_TYPE_NUMERIC = 1;
  SENSOR_VALUE_TYPE_TEXT = 2;
  SENSOR_VALUE_TYPE_BOOL = 3;
}

enum SensorSemantics {
  SENSOR_SEMANTICS_UNSPECIFIED = 0;
  // Universal
  SENSOR_SEMANTICS_UNIVERSAL = 1;
  // Common
  SENSOR_SEMANTICS_TEMPERATURE = 2;
  SENSOR_SEMANTICS_PRESSURE = 3;
  SENSOR_SEMANTICS_FREQUENCY = 4;
  SENSOR_SEMANTICS_MOISTURE = 5;
  SENSOR_SEMANTICS_UPTIME = 6;
  SENSOR_SEMANTICS_AREA = 7;
  SENSOR_SEMANTICS_DISTANCE = 8;
  SENSOR_SEMANTICS_DURATION = 9;
  SENSOR_SEMANTICS_ILLUMINANCE = 10;
  SENSOR_SEMANTICS_WATER = 11;
  SENSOR_SEMANTICS_WEIGHT = 12;
  // Air index
  SENSOR_SEMANTICS_AQI = 13;
  SENSOR_SEMANTICS_CO2 = 14;
  SENSOR_SEMANTICS_PM1 = 15;
  SENSOR_SEMANTICS_PM25 = 16;
  SENSOR_SEMANTICS_PM4 = 17;
  SENSOR_SEMANTICS_PM10 = 18;
  SENSOR_SEMANTICS_HUMIDITY = 19;
  // Wind
  SENSOR_SEMANTICS_WIND_SPEED = 20;
  // Electricity
  SENSOR_SEMANTICS_BATTERY = 21;
  SENSOR_SEMANTICS_ENERGY = 22;
  SENSOR_SEMANTICS_VOLTAGE = 23;
  SENSOR_SEMANTICS_CURRENT = 24;
  // Transmission
  SENSOR_SEMANTICS_DATA_RATE = 25;
  SENSOR_SEMANTICS_DATA_SIZE = 26;
  SENSOR_SEMANTICS_SIGNAL_STRENGTH = 27;
  // Earth
  SENSOR_SEMANTICS_PH = 28;
  SENSOR_SEMANTICS_POTASSIUM = 29;
  SENSOR_SEMANTICS_PHOSPHORUS = 30;
  SENSOR_SEMANTICS_NITROGEN = 31;
}

enum FuncArgType {
  FUNC_ARG_TYPE_UNSPECIFIED = 0;
  FUNC_ARG_TYPE_VOID = 1;
  FUNC_ARG_TYPE_INT = 2;
  FUNC_ARG_TYPE_FLOAT = 3;
  FUNC_ARG_TYPE_STRING = 4;
  FUNC_ARG_TYPE_BOOL = 5;
}

message Sensor {
  int32 id = 1;
  string name = 2;
  string description = 3;
  SensorValueType value_type = 4;
  SensorSemantics semantics = 5;
  optional string unit = 6;
}

message Function {
  int32 id = 1;
  string name = 2;
  string description = 3;
  FuncArgType arg_type = 4;
}

message Capabilities {
  string device_name = 1;
  repeated Sensor sensors = 2;
  repeated Function functions = 3;
}

message Report {
  int32 sensor_id = 1;
  oneof value {
    int32 int_val = 2;
    float float_val = 3;
    string str_val = 4;
    bool bool_val = 5;
  }
}

message Call {
  int32 function_id = 1;
  oneof value {
    int32 int_val = 2;
    string str_val = 3;
    bool bool_val = 4;
    float float_val = 5;
  }
  optional int32 wake_after_secs = 6;
}

enum UpPingType {
  UP_PING_TYPE_UNSPECIFIED = 0;
  UP_PING_TYPE_HELLO = 1;
}

message UpPing {
  UpPingType type = 1;
}

enum DownPingType {
  DOWN_PING_TYPE_UNSPECIFIED = 0;
  DOWN_PING_TYPE_HELLO = 1;
  DOWN_PING_TYPE_DISCONNECT = 2;
}

message DownPing {
  DownPingType type = 1;
}

message Downlink {
  oneof payload {
    Call call = 1;
    DownPing ping = 2;
  }
}

message Uplink {
  oneof payload {
    Report report = 1;
    Capabilities capabilities = 2;
    UpPing ping = 3;
  }
}
